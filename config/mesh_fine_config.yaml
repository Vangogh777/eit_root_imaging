# ═══════════════════════════════════════════════════════════
# 硬件设定：圆柱形桶（直径 20 cm），单环 16 电极，2D 截面采集
# 精细网格版本 (h0=0.0033 → ~6500 单元)
# ═══════════════════════════════════════════════════════════

mesh:
  # 2D 圆形域 = 桶的横截面
  type: "circle"
  radius: 0.10               # 桶半径 10 cm（直径 20 cm，典型盆栽桶）
  mesh_resolution: 0.0033    # 最大单元边长 → 约 6500 单元（5-7k 范围内）

electrodes:
  count: 16                  # 单环 16 电极（标准 EIT 配置）
  type: "circle"             # 沿桶壁等间距环形排列
  radius: 0.098              # 电极贴附半径（略小于桶内径，紧贴桶壁）

stimulation:
  pattern: "adjacent"        # 相邻激励模式
  amplitude: 1e-3            # 激励电流 (A) = 1mA
  frequencies: [1000]        # 单频率模式: 1kHz

ground_truth:
  conductivity_background: 0.1     # 背景电导率 (S/m)
  conductivity_inclusion: 0.5      # 内含物电导率 (S/m)
  conductivity_air: 1e-8           # 孔隙/空气电导率
  contrast_ratio: 5.0              # 内含物/背景对比度

data:
  train_samples: 1000
  val_samples: 100
  test_samples: 100
  noise_level_db: [-40, -20]
  random_seed: 42
