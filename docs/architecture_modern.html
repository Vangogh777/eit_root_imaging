<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConvSpatialEIT Architecture</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
}

.container {
    max-width: 1400px;
    width: 100%;
}

.header {
    text-align: center;
    margin-bottom: 50px;
}

.header h1 {
    font-size: 42px;
    font-weight: 700;
    background: linear-gradient(135deg, #60a5fa, #a78bfa, #22d3ee);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
    letter-spacing: -1px;
}

.header p {
    font-size: 16px;
    color: #64748b;
}

/* SVG Architecture Diagram */
.diagram-wrapper {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(59, 130, 246, 0.2);
    border-radius: 24px;
    padding: 40px;
    backdrop-filter: blur(20px);
    box-shadow:
        0 0 60px rgba(59, 130, 246, 0.1),
        inset 0 1px 0 rgba(255,255,255,0.05);
}

.architecture-svg {
    width: 100%;
    height: auto;
    display: block;
}

/* SVG Styles */
.module-box {
    fill: rgba(30, 41, 59, 0.9);
    stroke-width: 2;
    transition: all 0.3s ease;
}

.module-box:hover {
    filter: brightness(1.2);
}

.module-title {
    font-family: 'SF Pro Display', -apple-system, sans-serif;
    font-weight: 600;
    fill: #e2e8f0;
}

.module-text {
    font-family: 'SF Pro Display', -apple-system, sans-serif;
    fill: #94a3b8;
}

.data-box {
    fill: rgba(51, 65, 85, 0.8);
    stroke: rgba(148, 163, 184, 0.3);
    stroke-width: 1.5;
}

.data-text {
    font-family: 'SF Mono', 'Consolas', monospace;
    fill: #22d3ee;
}

.arrow-line {
    stroke: rgba(148, 163, 184, 0.6);
    stroke-width: 2;
    fill: none;
    marker-end: url(#arrowhead);
}

.arrow-glow {
    stroke: rgba(59, 130, 246, 0.3);
    stroke-width: 6;
    fill: none;
    filter: blur(3px);
}

/* Color schemes for different modules */
.color-encoder { stroke: #3b82f6; }
.color-blc { stroke: #f59e0b; }
.color-fusion { stroke: #10b981; }
.color-backbone { stroke: #ec4899; }
.color-output { stroke: #8b5cf6; }

/* Animation */
@keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
}

@keyframes flow {
    0% { stroke-dashoffset: 20; }
    100% { stroke-dashoffset: 0; }
}

.animated-arrow {
    stroke-dasharray: 10 5;
    animation: flow 1s linear infinite;
}

/* Legend */
.legend {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 40px;
    flex-wrap: wrap;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: #94a3b8;
}

.legend-color {
    width: 24px;
    height: 4px;
    border-radius: 2px;
}

/* Footer */
.footer {
    text-align: center;
    margin-top: 40px;
    padding-top: 30px;
    border-top: 1px solid rgba(59, 130, 246, 0.15);
}

.footer p {
    font-size: 13px;
    color: #475569;
}

/* Responsive */
@media (max-width: 768px) {
    .header h1 { font-size: 28px; }
    .diagram-wrapper { padding: 20px; }
    .legend { gap: 15px; }
}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>ConvSpatialEIT Architecture</h1>
        <p>Spatial-Frequency Shared Network with Graph Neural Refinement</p>
    </div>

    <div class="diagram-wrapper">
        <svg class="architecture-svg" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
            <!-- Definitions -->
            <defs>
                <!-- Arrow marker -->
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
                </marker>

                <!-- Gradients -->
                <linearGradient id="grad-encoder" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
                    <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.1" />
                </linearGradient>
                <linearGradient id="grad-blc" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.3" />
                    <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.1" />
                </linearGradient>
                <linearGradient id="grad-fusion" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3" />
                    <stop offset="100%" style="stop-color:#059669;stop-opacity:0.1" />
                </linearGradient>
                <linearGradient id="grad-backbone" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.3" />
                    <stop offset="100%" style="stop-color:#db2777;stop-opacity:0.1" />
                </linearGradient>
                <linearGradient id="grad-output" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3" />
                    <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.1" />
                </linearGradient>

                <!-- Glow filter -->
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <!-- Shadow filter -->
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
                </filter>
            </defs>

            <!-- ========== INPUT ========== -->
            <g transform="translate(50, 280)">
                <rect class="data-box" x="0" y="0" width="120" height="60" rx="8" filter="url(#shadow)"/>
                <text class="data-text" x="60" y="25" text-anchor="middle" font-size="14" font-weight="600">V</text>
                <text class="module-text" x="60" y="45" text-anchor="middle" font-size="11">(B, 6, 208)</text>
            </g>
            <text x="110" y="365" text-anchor="middle" font-size="10" fill="#64748b">Multi-freq Voltage</text>

            <!-- ========== FreqCrossAttention ========== -->
            <g transform="translate(220, 200)">
                <rect class="module-box color-encoder" x="0" y="0" width="160" height="140" rx="12" fill="url(#grad-encoder)" filter="url(#shadow)"/>
                <text class="module-title" x="80" y="28" text-anchor="middle" font-size="13">FreqCrossAttn</text>
                <line x1="20" y1="40" x2="140" y2="40" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
                <text class="module-text" x="80" y="60" text-anchor="middle" font-size="10">MultiheadAttention</text>
                <text class="module-text" x="80" y="78" text-anchor="middle" font-size="10">n_heads = 8</text>
                <text class="module-text" x="80" y="96" text-anchor="middle" font-size="10">+ LayerNorm</text>
                <text class="module-text" x="80" y="114" text-anchor="middle" font-size="10">+ GELU</text>
            </g>

            <!-- ========== ConvEncoder ========== -->
            <g transform="translate(220, 360)">
                <rect class="module-box color-encoder" x="0" y="0" width="160" height="100" rx="12" fill="url(#grad-encoder)" filter="url(#shadow)"/>
                <text class="module-title" x="80" y="28" text-anchor="middle" font-size="13">ConvEncoder</text>
                <line x1="20" y1="40" x2="140" y2="40" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
                <text class="module-text" x="80" y="60" text-anchor="middle" font-size="10">Conv1d × 4 layers</text>
                <text class="module-text" x="80" y="78" text-anchor="middle" font-size="10">hidden_dim = 256</text>
            </g>

            <!-- Intermediate: h -->
            <g transform="translate(430, 280)">
                <rect class="data-box" x="0" y="0" width="80" height="50" rx="6" filter="url(#shadow)"/>
                <text class="data-text" x="40" y="22" text-anchor="middle" font-size="13" font-weight="600">h</text>
                <text class="module-text" x="40" y="40" text-anchor="middle" font-size="10">(B, 6, 256)</text>
            </g>

            <!-- ========== GridSampler + PE ========== -->
            <g transform="translate(550, 180)">
                <rect class="module-box color-blc" x="0" y="0" width="180" height="120" rx="12" fill="url(#grad-blc)" filter="url(#shadow)"/>
                <text class="module-title" x="90" y="28" text-anchor="middle" font-size="13">GridSampler + PE</text>
                <line x1="20" y1="40" x2="160" y2="40" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>
                <text class="module-text" x="90" y="60" text-anchor="middle" font-size="10">Sample to mesh nodes</text>
                <text class="module-text" x="90" y="78" text-anchor="middle" font-size="10">Fourier Position Enc</text>
                <text class="module-text" x="90" y="96" text-anchor="middle" font-size="10">dim_pe = 35</text>
            </g>

            <!-- Intermediate: node_features -->
            <g transform="translate(770, 220)">
                <rect class="data-box" x="0" y="0" width="90" height="50" rx="6" filter="url(#shadow)"/>
                <text class="data-text" x="45" y="22" text-anchor="middle" font-size="12" font-weight="600">x_nodes</text>
                <text class="module-text" x="45" y="40" text-anchor="middle" font-size="10">(B, N, D)</text>
            </g>

            <!-- ========== SimpleGNN × 4 ========== -->
            <g transform="translate(550, 340)">
                <rect class="module-box color-fusion" x="0" y="0" width="180" height="140" rx="12" fill="url(#grad-fusion)" filter="url(#shadow)"/>
                <text class="module-title" x="90" y="28" text-anchor="middle" font-size="13">SimpleGNN × 4</text>
                <line x1="20" y1="40" x2="160" y2="40" stroke="#10b981" stroke-width="1" opacity="0.3"/>
                <text class="module-text" x="90" y="60" text-anchor="middle" font-size="10">EdgeConv MessagePassing</text>
                <text class="module-text" x="90" y="78" text-anchor="middle" font-size="10">edge_net: MLP(→32→1)</text>
                <text class="module-text" x="90" y="96" text-anchor="middle" font-size="10">aggr: softmax_attn</text>
                <text class="module-text" x="90" y="114" text-anchor="middle" font-size="10">residual connection</text>
            </g>

            <!-- Intermediate: refined -->
            <g transform="translate(770, 380)">
                <rect class="data-box" x="0" y="0" width="90" height="50" rx="6" filter="url(#shadow)"/>
                <text class="data-text" x="45" y="22" text-anchor="middle" font-size="12" font-weight="600">h_gnn</text>
                <text class="module-text" x="45" y="40" text-anchor="middle" font-size="10">(B, N, D)</text>
            </g>

            <!-- ========== OutputHead ========== -->
            <g transform="translate(900, 280)">
                <rect class="module-box color-output" x="0" y="0" width="150" height="120" rx="12" fill="url(#grad-output)" filter="url(#shadow)"/>
                <text class="module-title" x="75" y="28" text-anchor="middle" font-size="13">OutputHead</text>
                <line x1="15" y1="40" x2="135" y2="40" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
                <text class="module-text" x="75" y="60" text-anchor="middle" font-size="10">MLP: 256→128→64</text>
                <text class="module-text" x="75" y="78" text-anchor="middle" font-size="10">→ n_elems</text>
                <text class="module-text" x="75" y="96" text-anchor="middle" font-size="10">+ Sigmoid</text>
            </g>

            <!-- ========== OUTPUT ========== -->
            <g transform="translate(1090, 280)">
                <rect class="data-box" x="0" y="0" width="90" height="60" rx="8" filter="url(#shadow)" stroke="#8b5cf6" stroke-width="2"/>
                <text class="data-text" x="45" y="25" text-anchor="middle" font-size="14" font-weight="600">σ</text>
                <text class="module-text" x="45" y="45" text-anchor="middle" font-size="11">(B, 11466)</text>
            </g>
            <text x="1135" y="365" text-anchor="middle" font-size="10" fill="#64748b">Conductivity Map</text>

            <!-- ========== ARROWS ========== -->
            <!-- Input → FreqCrossAttn -->
            <path class="arrow-line animated-arrow" d="M170,310 L220,270"/>

            <!-- Input → ConvEncoder -->
            <path class="arrow-line" d="M170,310 L220,400"/>

            <!-- FreqCrossAttn → h -->
            <path class="arrow-line" d="M380,270 L430,300"/>

            <!-- ConvEncoder → h -->
            <path class="arrow-line" d="M380,400 L430,310"/>

            <!-- h → GridSampler -->
            <path class="arrow-line animated-arrow" d="M510,305 L550,240"/>

            <!-- h → SimpleGNN -->
            <path class="arrow-line" d="M510,310 L550,400"/>

            <!-- GridSampler → x_nodes -->
            <path class="arrow-line" d="M730,240 L770,245"/>

            <!-- x_nodes → SimpleGNN (loop back) -->
            <path class="arrow-line" d="M815,270 Q850,320 815,380" stroke-dasharray="5,3"/>

            <!-- SimpleGNN → h_gnn -->
            <path class="arrow-line" d="M730,400 L770,405"/>

            <!-- h_gnn → OutputHead -->
            <path class="arrow-line animated-arrow" d="M860,405 L900,340"/>

            <!-- x_nodes → OutputHead -->
            <path class="arrow-line" d="M860,245 L900,320"/>

            <!-- OutputHead → Output -->
            <path class="arrow-line" d="M1050,340 L1090,310"/>

            <!-- ========== PARAMS BOX ========== -->
            <g transform="translate(50, 520)">
                <rect x="0" y="0" width="1100" height="140" rx="12" fill="rgba(30,41,59,0.5)" stroke="rgba(59,130,246,0.2)" stroke-width="1"/>
                <text class="module-title" x="550" y="30" text-anchor="middle" font-size="14">Model Parameters</text>
                <line x1="100" y1="45" x2="1000" y2="45" stroke="rgba(59,130,246,0.2)" stroke-width="1"/>

                <!-- Param columns -->
                <g transform="translate(80, 60)">
                    <text class="data-text" x="0" y="15" font-size="12" font-weight="600">Input</text>
                    <text class="module-text" x="0" y="35" font-size="10">B: batch size</text>
                    <text class="module-text" x="0" y="52" font-size="10">6: frequencies</text>
                    <text class="module-text" x="0" y="69" font-size="10">208: measurements</text>
                </g>

                <g transform="translate(280, 60)">
                    <text class="data-text" x="0" y="15" font-size="12" font-weight="600">Mesh</text>
                    <text class="module-text" x="0" y="35" font-size="10">N: 5859 nodes</text>
                    <text class="module-text" x="0" y="52" font-size="10">E: 11466 elements</text>
                    <text class="module-text" x="0" y="69" font-size="10">147260 directed edges</text>
                </g>

                <g transform="translate(480, 60)">
                    <text class="data-text" x="0" y="15" font-size="12" font-weight="600">Hidden</text>
                    <text class="module-text" x="0" y="35" font-size="10">D: 256 hidden dim</text>
                    <text class="module-text" x="0" y="52" font-size="10">n_heads: 8 attention</text>
                    <text class="module-text" x="0" y="69" font-size="10">4 GNN layers</text>
                </g>

                <g transform="translate(680, 60)">
                    <text class="data-text" x="0" y="15" font-size="12" font-weight="600">Output</text>
                    <text class="module-text" x="0" y="35" font-size="10">σ: conductivity</text>
                    <text class="module-text" x="0" y="52" font-size="10">range: [0.01, 0.05]</text>
                    <text class="module-text" x="0" y="69" font-size="10">S/m</text>
                </g>

                <g transform="translate(880, 60)">
                    <text class="data-text" x="0" y="15" font-size="12" font-weight="600">Total Params</text>
                    <text class="module-text" x="0" y="35" font-size="10">~6.1M parameters</text>
                    <text class="module-text" x="0" y="52" font-size="10">FP16: ~12MB</text>
                    <text class="module-text" x="0" y="69" font-size="10">FP32: ~24MB</text>
                </g>
            </g>
        </svg>
    </div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-color" style="background: linear-gradient(90deg, #3b82f6, #1d4ed8)"></div>
            <span>Frequency Encoding</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: linear-gradient(90deg, #f59e0b, #d97706)"></div>
            <span>Spatial Sampling</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: linear-gradient(90deg, #10b981, #059669)"></div>
            <span>Graph Neural Net</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: linear-gradient(90deg, #8b5cf6, #7c3aed)"></div>
            <span>Output Projection</span>
        </div>
    </div>

    <div class="footer">
        <p>ConvSpatialEIT · Physics-Informed Deep Learning for Electrical Impedance Tomography</p>
    </div>
</div>

</body>
</html>
